<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 596" width="1284" height="596" role="img" aria-label="Rework &lt;script setup&gt; compiler: drop export-based bindings, add ref: sugar, and inline render function into setup()">
<title>Rework &lt;script setup&gt; compiler: drop export-based bindings, add ref: sugar, and inline render function into setup()</title>
<desc>This PR rewrites the experimental &lt;script setup&gt; compiler in compiler-sfc: it removes the previous RFC's export-based mechanism for exposing bindings (export const/export {}/export * from) in favor of automatically exposing all top-level declarations, and adds an experimental `ref:` label sugar that rewrites `ref: x = 1` into `const x = ref(1)` and rewrites subsequent reads/writes of `x` to `x.value`. It also introduces an `inlineTemplate` compile option that compiles the SFC template and inlines its render function directly inside `setup()`. To support that inlining, compiler-core's transform/codegen pipeline gained a shared `inline` flag: codegen can now emit a bare arrow function plus a separately returned `preamble` instead of a standalone `function render()`, and the component/expression resolvers learned to unwrap ref-typed setup bindings via a new `UNREF` runtime helper or reference raw imports directly, instead of always going through `$setup[...]`. Test snapshots and specs were rewritten to match the new codegen output and the retired export-based test cases.</desc>
