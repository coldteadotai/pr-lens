<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 908" width="1284" height="908" role="img" aria-label="Implement PagedAttention V2">
<title>Implement PagedAttention V2</title>
<desc>This PR splits the CUDA PagedAttention kernel into a V1 path (the original single-pass kernel, renamed) and a new V2 path that partitions long contexts across the grid's z-dimension, computing partial softmax statistics per partition and then combining them in a new reduction kernel. The Python attention layer now picks V1 or V2 at runtime with a simple heuristic (few partitions or a large batch × head count favors V1), allocates the extra exp_sums/max_logits/tmp_out scratch tensors V2 needs, and passes ALiBi slopes uniformly through a new get_alibi_slopes() hook shared by both the plain and ALiBi PagedAttention variants (removing the ALiBi subclass's separate kernel-call override). A new benchmark script and expanded kernel tests exercise both versions.</desc>
