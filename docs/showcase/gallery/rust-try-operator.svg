<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1708 596" width="1708" height="596" role="img" aria-label="Implement the `?` (question mark) try operator">
<title>Implement the `?` (question mark) try operator</title>
<desc>Adds `expr?` as sugar for early-returning a `Result`'s `Err` case, threaded through the full front-end pipeline: the parser recognizes a trailing `?` and produces a new `ExprKind::Try` AST node, which is gated behind an unstable `question_mark` feature, then desugared during AST-to-HIR lowering into a hygienic `match expr { Ok(val) =&gt; val, Err(err) =&gt; return Err(From::from(err)) }`. The desugared match is tagged with a new `MatchSource::TryDesugar` so the exhaustiveness checker treats an unreachable arm there as an internal compiler bug rather than a user-facing lint. The change also updates roughly a dozen existing parse-fail tests whose expected-token error messages now must include `?`, and adds new compile-fail/run-pass tests covering feature gating, ~20 syntactic positions, and hygiene.</desc>
