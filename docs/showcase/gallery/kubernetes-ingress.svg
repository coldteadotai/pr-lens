<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1708 492" width="1708" height="492" role="img" aria-label="Add Ingress resource type to the experimental API (internal + v1)">
<title>Add Ingress resource type to the experimental API (internal + v1)</title>
<desc>This PR defines a new Ingress/IngressList API object — the initial version of Kubernetes' L7 load-balancing resource — as pure type scaffolding: it adds the Go structs (IngressSpec, IngressStatus, IngressRule, IngressPath, IngressBackend) to both the internal experimental API package and its versioned experimental/v1 counterpart, registers the new types with each package's runtime scheme, generates the deep-copy and bidirectional v1↔internal conversion functions the API machinery needs to store and serve them, and generates swagger field docs for the v1 type. IngressStatus reuses the existing core LoadBalancerStatus/LoadBalancerIngress types that Service already relies on, so this change also backfills deep-copy/convert functions for those types where the experimental package previously had no need to generate them. No REST storage, admission, or controller wiring is included yet — this is the type-definition groundwork only.</desc>
