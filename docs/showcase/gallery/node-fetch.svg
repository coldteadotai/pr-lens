<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2132 492" width="2132" height="492" role="img" aria-label="Add experimental global fetch() backed by vendored undici">
<title>Add experimental global fetch() backed by vendored undici</title>
<desc>This change introduces a browser-compatible fetch() (plus Headers, Request, Response) as an opt-in global, gated behind a new --experimental-fetch CLI flag. The implementation is not written in Node itself: it vendors the entire undici HTTP client library into deps/undici/undici.js (~8,000 lines) and, at startup, lazily requires that bundle and attaches its fetch/Headers/Request/Response exports onto globalThis only when the flag is set. Supporting changes wire the flag through the C++ options parser, call the new setup routine from both the main-thread and worker-thread bootstrap paths, teach the test harness's global-leak detector about the new globals, add a smoke test, and update docs/licensing/eslint globals accordingly.</desc>
