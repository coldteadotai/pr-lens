<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1302 968" width="1302" height="968" role="img" aria-label="Batch broadcast sending through Postmark">
<title>Batch broadcast sending through Postmark</title>
<desc>Broadcast delivery moves from one Postmark request per recipient to batched requests of 500, with suppression filtering pulled in front of the send and the payload builder extracted into a shared library.</desc>
