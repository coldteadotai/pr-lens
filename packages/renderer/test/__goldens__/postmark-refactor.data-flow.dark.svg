<circle r="2.8" fill="#3fb950" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.4644;0.5444;1" calcMode="linear" path="M557,247 L770,247"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4644;0.4744;0.5444;0.5544;1"/></circle>
