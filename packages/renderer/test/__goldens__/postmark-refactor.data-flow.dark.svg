<circle r="2.8" fill="#3fb950" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1311;0.2111;1" calcMode="linear" path="M327,133 L540,133"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1311;0.1411;0.2111;0.2211;1"/></circle></g>
