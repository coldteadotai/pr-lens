<text class="ptitle" x="91" y="39">queue route</text>
<rect class="pcard" x="246" y="18" width="150" height="34" rx="8"/>
<text class="ptitle" x="321" y="39">Firestore</text>
<rect class="pcard" x="476" y="18" width="150" height="34" rx="8"/>
<text class="ptitle" x="551" y="39">sendBroadcastBulk</text>
<rect class="pcard" x="706" y="18" width="150" height="34" rx="8"/>
<text class="ptitle" x="781" y="39">Postmark</text></g>
<g><g><text class="msg-label" x="200.5" y="88">enqueue broadcast job</text>
