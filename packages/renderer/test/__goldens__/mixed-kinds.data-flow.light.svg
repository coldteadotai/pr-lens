<circle r="2.8" fill="#1a7f37" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5225;0.6;1" calcMode="linear" path="M91,263 L540,263"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5225;0.53;0.6;0.6075;1"/></circle></g>
