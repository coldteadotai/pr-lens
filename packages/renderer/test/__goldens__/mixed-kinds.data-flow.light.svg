<rect class="pcard" x="476" y="18" width="150" height="34" rx="8"/>
<text class="ptitle" x="551" y="39">order store</text></g>
<g><g><text class="msg-label" x="200.5" y="88">place order</text>
<path class="msg edge-modified" d="M91,95 L310,95" marker-end="url(#mk-modified)"/>
<circle r="2.8" fill="#9a6700" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0225;0.1;1" calcMode="linear" path="M91,95 L310,95"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0225;0.03;0.1;0.1075;1"/></circle></g>
