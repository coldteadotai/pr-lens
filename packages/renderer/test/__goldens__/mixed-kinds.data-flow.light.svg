<circle r="2.8" fill="#8c959f" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2725;0.35;1" calcMode="linear" path="M327,171 h52 a7,7 0 0 1 7,7 v6 a7,7 0 0 1 -7,7 h-47"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2725;0.28;0.35;0.3575;1"/></circle></g>
<g><text class="msg-label" x="205.5" y="218">order confirmed</text>
<path class="msg edge-modified msg-return" d="M315,225 L96,225" marker-end="url(#mk-modified)"/>
<circle r="2.8" fill="#9a6700" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3975;0.475;1" calcMode="linear" path="M315,225 L96,225"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3975;0.405;0.475;0.4825;1"/></circle></g>
