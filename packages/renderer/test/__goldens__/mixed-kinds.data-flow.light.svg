<circle r="2.8" fill="#1a7f37" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.7725;0.85;1" calcMode="linear" path="M91,339 L316,339"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7725;0.78;0.85;0.8575;1"/></circle></g>
