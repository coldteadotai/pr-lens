<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 180" width="202" height="180" role="img" aria-label="Touch the health check">
<title>Touch the health check</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.lanebox{fill:#f6f8fa}.lanelabel{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#59636e}.card{fill:#ffffff;stroke:#d1d9e0;stroke-width:1}.card-added{stroke:#1a7f37;stroke-opacity:.55}.card-modified{stroke:#9a6700;stroke-opacity:.5}.ghost{opacity:.55}.ghost .card{stroke:#d1242f;stroke-dasharray:4 3;stroke-opacity:.6}.context{opacity:.82}.ntitle{font-weight:600;fill:#1f2328}.strike{text-decoration:line-through}.nsub{font-size:9.5px;fill:#59636e;font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace}.chip{fill:#f6f8fa}.glyph{fill:#59636e}.glyph-stroke{stroke:#59636e;stroke-width:1.4;fill:none}.bdg text{font-size:8.5px;font-weight:700;letter-spacing:.06em}.bdg rect{stroke-width:1}.bdg-added rect{fill:#dafbe1;stroke:rgba(31,136,61,.4)}.bdg-added text{fill:#1a7f37}.bdg-modified rect{fill:#fff8c5;stroke:rgba(154,103,0,.35)}.bdg-modified text{fill:#9a6700}.bdg-removed rect{fill:#ffebe9;stroke:rgba(209,36,47,.35)}.bdg-removed text{fill:#d1242f}.bdg-neutral rect{fill:#f6f8fa;stroke:#d1d9e0}.bdg-neutral text{fill:#59636e}.edge{fill:none;stroke-width:1.5}.edge-added{stroke:#1a7f37}.edge-modified{stroke:#9a6700}.edge-removed{stroke:#d1242f;stroke-dasharray:5 4;opacity:.7}.edge-neutral{stroke:#8c959f}.hero{stroke-width:2.25}.faded{opacity:.45}.glow{fill:none;stroke-width:7;opacity:.14}.msg-self{font-size:11px;fill:#1f2328}.lpill{fill:#ffffff;stroke:#d8dee4;stroke-width:1}.ltext{font-size:9.5px;font-weight:600;fill:#59636e}.ltext-added{fill:#1a7f37}.ltext-modified{fill:#9a6700}.ltext-removed{fill:#d1242f}.cardsh{filter:drop-shadow(0 1px 2px rgba(31,35,40,.14))}.pcard{fill:#ffffff;stroke:#d1d9e0;stroke-width:1}.ptitle{font-size:12px;font-weight:600;fill:#1f2328;text-anchor:middle}.lifeline{stroke:#d1d9e0;stroke-width:1;stroke-dasharray:3 4}.actbar{fill:#dafbe1;stroke:rgba(31,136,61,.4)}.msg{fill:none;stroke-width:1.4}.msg-return{stroke-dasharray:4 3;opacity:.8}.msg-label{font-size:11px;fill:#1f2328;text-anchor:middle}.msg-strong{stroke-width:2}</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="rgba(140,149,159,.35)"/></pattern><marker id="mk-added" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="mk-modified" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="mk-removed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/></marker><marker id="mk-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="0" y="0" width="202" height="180" rx="12" fill="#ffffff"/>
<rect x="0" y="0" width="202" height="180" rx="12" fill="url(#dots)"/>
<g><rect class="lanebox" x="16" y="44" width="169.53" height="120" rx="12"/>
<text class="lanelabel" x="32" y="68">API</text></g>
<g></g>
<g><g class="cardsh"><rect class="card card-modified" x="32" y="92" width="137.53" height="52" rx="10"/>
<text class="ntitle" x="46" y="123" font-size="11.5">GET /health</text>
<g class="bdg bdg-modified"><rect x="95.91" y="84" width="66.62" height="16" rx="8"/><text x="129.22" y="95" text-anchor="middle">CHANGED</text></g></g></g>
</svg>