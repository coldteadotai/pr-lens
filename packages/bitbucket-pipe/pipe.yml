name: PR Lens
image: coldtea/pr-lens-pipe:0.1.0
# One of Atlassian's fixed set, spelled as they spell it. Required: the
# listing refuses a pipe without it.
category: Code quality
description: Draw a pull request as architecture and data-flow diagrams, posted as one comment on the pull request, using your own model key.
repository: https://github.com/coldteadotai/pr-lens
# Objects, not strings. A string here parses as YAML and fails validation.
maintainer:
  name: Coldtea AI
  website: https://www.coldtea.ai
vendor:
  name: Coldtea AI
  website: https://www.coldtea.ai
tags:
  - code-review
  - pull-request
  - diagram
  - architecture
  - documentation
variables:
  - name: MODEL_PROVIDER
    default: gemini
  - name: MODEL
    default: ""
  - name: BASE_URL
    default: ""
  - name: LENS
    default: ""
  - name: BRANDING
    default: "true"
  - name: COMMENT
    default: "true"
  - name: CLI_VERSION
    default: "0.10.0"
  - name: API_KEY_VARIABLE
    default: GEMINI_API_KEY
  - name: TOKEN_VARIABLE
    default: PR_LENS_TOKEN
